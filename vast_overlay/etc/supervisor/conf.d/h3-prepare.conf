[program:h3-prepare]
command=/opt/minimax-h3/docker-entrypoint.sh
autostart=true
autorestart=false
startsecs=0
# Run before the base image's portal services are started.  The preparation
# script removes the stock Caddy listener so it cannot collide with the
# ComfyUI/auth-proxy port layout below.
priority=1
stdout_logfile=/var/log/portal/h3-prepare.log
stderr_logfile=/var/log/portal/h3-prepare-error.log
